name: Build

# Analyze, test and build the Android APK. The APK is uploaded as a workflow
# artifact so a tester can install it straight from the run page.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.4'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Rebuild the content database from source
        # The pipeline is reproducible, so the committed database must be
        # byte-identical to what content/source/ produces (PRD §8).
        run: |
          python3 tools/content_pipeline/build_content_db.py
          git diff --exit-code -- assets/content/content.db

      - name: Verify generated code is up to date
        run: |
          flutter gen-l10n
          dart run build_runner build
          git diff --exit-code -- lib/core/db lib/core/l10n

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded

      - name: What resource shrinking does to the media notification
        # Evidence, not a build step. audio_service resolves every icon in the
        # media notification by name at runtime -- getIdentifier(), from a
        # string that lives in the Dart snapshot and so is invisible to the
        # resource shrinker. This builds one throwaway APK with shrinking on
        # and prints what is left of those icons. It never fails the build; the
        # assertion is on the real APK below.
        continue-on-error: true
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm64 -Phazri.shrinkResources=true
          bash .github/check_notification_icons.sh \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk || true

      - name: Build debug-signed release APK (arm64)
        # Split per ABI: a phone only needs its own slice, and arm64-v8a covers
        # every Android device sold in the last several years.
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: The media notification's icons survived the build
        # A missing small icon makes startForeground() throw, which loses the
        # notification and with it the lock-screen controls, while the
        # recitation carries on playing. Invisible in a build log and invisible
        # in a widget test, so look in the APK itself.
        run: |
          bash .github/check_notification_icons.sh \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Name the artifact
        id: name
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: hazri-apk-${{ steps.name.outputs.sha }}
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Report the APK size
        run: ls -lh build/app/outputs/flutter-apk/*.apk
