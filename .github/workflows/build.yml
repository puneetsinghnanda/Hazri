name: Build

# Analyze, test and build the Android APK.
#
# The APK is only kept when the run was asked for by hand (Actions -> Build ->
# Run workflow). Every push still builds it, because a build that only compiles
# on demand stops catching the things a widget test cannot; it is keeping the
# 95 MiB that is deliberate.
#
# It is kept as a **pre-release**, not as an artifact. The artifact store on
# this plan is 500 MB, which is five of these, and its usage figure is
# account-wide and recalculated only every 6-12 hours -- so a run could build
# and check a perfectly good APK and still be refused at the last step with
# "Artifact storage quota has been hit", which reads like a broken build and
# is not one. It did, three times. Release assets are not counted against that
# quota at all, so one rolling pre-release per branch, apk-<branch>, replaced
# on the next hand-started run of that branch.
#
# A push or pull request builds only when it touches something the build
# reads (owner, 2026-10-19). Each run is about fifteen minutes and the
# account's free Actions minutes are shared; a push that changes only the
# website, the docs, the designs or the server code cannot change the APK, and
# the server code has its own workflow. The list below (twice: push and pull
# request take the same one) is everything this job
# reads: the app, its content and the pipeline that rebuilds content.db, its
# settings, and the three files outside them that app tests open. A test that
# starts reading another file outside these must add it here, or a change to
# that file will not be checked until the next app push. Run workflow by hand
# always builds.
on:
  push:
    branches: ['**']
    paths:
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - 'assets/**'
      - 'content/**'
      - 'tools/content_pipeline/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'l10n.yaml'
      - '.metadata'
      - '.github/workflows/build.yml'
      # Read by test/android/firebase_hosting_test.dart and assetlinks_test.dart.
      - 'firebase.json'
      - 'public/.well-known/**'
      # Read by test/android/manifest_test.dart.
      - 'functions/src/notifications/messenger.ts'
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - 'assets/**'
      - 'content/**'
      - 'tools/content_pipeline/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'l10n.yaml'
      - '.metadata'
      - '.github/workflows/build.yml'
      # Read by test/android/firebase_hosting_test.dart and assetlinks_test.dart.
      - 'firebase.json'
      - 'public/.well-known/**'
      # Read by test/android/manifest_test.dart.
      - 'functions/src/notifications/messenger.ts'
  workflow_dispatch:

# Only the newest push to a branch needs building. Without this every push
# started its own sixteen-minute Android build and they queued behind each
# other, so the result you were waiting on was the third one in line.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.4'
  # Whether this run can sign properly. A fork has no access to the secret,
  # and `secrets` cannot be read in a step's `if`, so it is resolved here into
  # a plain string the steps can test.
  HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
  # No resident daemon: this runner builds once and is destroyed. A daemon
  # holds a JVM open for a next build that never comes, on a machine with
  # 7 GB to share.
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    # Pinned, not ubuntu-latest: the content check below wants content.db
    # byte for byte, and SQLite lays the same database out differently from
    # one version to the next. ubuntu-latest moved to 26.04 in October 2026
    # and failed that check on a database 24.04's SQLite 3.45 builds
    # identically every time (run 255, 2026-10-25).
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # contents: write is for the release the APK is published to. Nothing else
    # in this workflow writes to the repository.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The Android build is the long pole at twelve minutes cold. Most of
      # that is Gradle fetching and unpacking the same artifacts every run.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Rebuild the content database from source
        # The pipeline is reproducible, so the committed database must be
        # byte-identical to what content/source/ produces (PRD §8).
        run: |
          python3 tools/content_pipeline/build_content_db.py
          git diff --exit-code -- assets/content/content.db

      - name: Verify generated code is up to date
        run: |
          flutter gen-l10n
          dart run build_runner build
          git diff --exit-code -- lib/core/db lib/core/l10n

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded

      - name: How much memory this runner actually has
        # Printed before the build, so the next time it dies at twelve minutes
        # there is a number in the log rather than a guess.
        run: free -h && df -h /

      - name: Unpack the release signing key
        # Without this every run was signed with a throwaway debug key the
        # Android Gradle Plugin generated on the runner and discarded with it.
        # A new APK then refused to install over an old one -- Android rejects
        # a package whose signature changed -- so every build cost an
        # uninstall, and an uninstall takes user.db with it: the diary, the
        # goals, the anonymous account. It also made App Links impossible,
        # since assetlinks.json has to name one SHA-256.
        #
        # The keystore is written to RUNNER_TEMP, never into the checkout, so
        # it cannot be picked up by anything that globs the working tree.
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hazri-release.jks"
          # A truncated or mis-pasted secret decodes to something that is not
          # a keystore, and Gradle's complaint about it is four screens of
          # Java. Fail here instead, where the cause is one line.
          keytool -list -keystore "$RUNNER_TEMP/hazri-release.jks" \
            -storepass "$STORE_PASSWORD" > /dev/null
          {
            echo "storeFile=$RUNNER_TEMP/hazri-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Say which key this build is signed with
        # So a build that quietly fell back to a throwaway key is visible in
        # the log rather than three days later on a phone that will not take
        # the update.
        run: |
          if [ "$HAS_KEYSTORE" = 'true' ]; then
            echo "Signed with the release key. This APK installs over a previous one."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, so this APK is"\
                 "signed with a throwaway debug key. It compiles and it runs,"\
                 "but it will not install over a release-signed build and its"\
                 "SHA-256 is not the one in assetlinks.json."
          fi

      - name: Build the release APK (arm64)
        # Split per ABI: a phone only needs its own slice, and arm64-v8a covers
        # every Android device sold in the last several years.
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Which certificate actually signed it
        # Read out of the APK rather than assumed from the inputs. This SHA-256
        # is the one that has to be in public/.well-known/assetlinks.json, and
        # a mismatch there fails App Link verification silently -- the link
        # just opens a browser and nobody is told why.
        #
        # Written twice. The first version globbed
        # "$ANDROID_HOME"/build-tools/*/apksigner, which matches every
        # build-tools version the runner has: the first path became the
        # command and the rest became its arguments, so it answered
        # "Unsupported command" -- and `|| true` swallowed that, leaving a
        # green step that printed nothing. A step that cannot fail cannot
        # report. Pick one binary, the newest, and let a failure be a failure.
        run: |
          set -euo pipefail
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "Using $APKSIGNER"
          "$APKSIGNER" verify --print-certs \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            | tee /tmp/certs.txt
          # No `|| true`: no fingerprint means assetlinks.json cannot be
          # written, which is worth failing the build over.
          grep -i 'SHA-256 digest' /tmp/certs.txt

      - name: The media notification's icons survived the build
        # A missing small icon makes startForeground() throw, which loses the
        # notification and with it the lock-screen controls, while the
        # recitation carries on playing. That is invisible in a build log and
        # invisible in a widget test, so look inside the APK itself.
        run: |
          bash .github/check_notification_icons.sh \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Build the Play Store bundle
        # Google Play takes an app bundle, not an APK. Built only on a run
        # started by hand, because it is a second full Gradle build and a push
        # has no use for it. Every ABI, not arm64 alone: Play cuts each phone
        # its own slice from the bundle.
        #
        # The build number is the run number, so every bundle uploaded is
        # higher than the last -- Play refuses a versionCode it has seen -- and
        # nobody has to remember to bump pubspec.yaml's `+1`.
        #
        # Only with the release key. Play binds the app to the first upload
        # key it sees; a bundle signed by the throwaway debug key would be
        # refused, or worse, accepted as the key from then on.
        if: github.event_name == 'workflow_dispatch' && env.HAS_KEYSTORE == 'true'
        run: |
          set -euo pipefail
          flutter build appbundle --release --build-number=${{ github.run_number }}
          AAB=build/app/outputs/bundle/release/app-release.aab
          # The upload key Play will see, read out of the bundle itself.
          keytool -printcert -jarfile "$AAB" | tee /tmp/aab-cert.txt
          grep -i 'SHA256' /tmp/aab-cert.txt
          ls -lh "$AAB"

      - name: Name the artifact
        # always(), so an APK that built is still kept when a later check fails
        # -- that is the build you most want to put on a phone and look at.
        if: always() && github.event_name == 'workflow_dispatch'
        id: name
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish the APK as a pre-release
        # This is the copy that is meant to be there, because a release asset
        # does not touch the artifact quota. One tag per branch, deleted and
        # remade each run, so the number of APKs alive at once is the number of
        # branches being tested and no more.
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: apk-${{ github.ref_name }}
          SHA: ${{ steps.name.outputs.sha }}
        run: |
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          # Before touching the release at all. This step deleted the tag and
          # then failed to recreate it, because the build it was publishing had
          # not produced an APK -- so a broken build destroyed the working one
          # somebody was still installing from. Nothing below runs unless there
          # is a file to publish.
          if [ ! -f "$APK" ]; then
            echo "No APK was built, so the existing release is left alone."
            exit 1
          fi
          NOTES="Release-signed arm64 test build of ${GITHUB_REF_NAME} at ${SHA}. Replaced on the next hand-started run of this branch. Signed with the project keystore since 2026-09-27, so this installs over the previous one; anything older than that needs an uninstall first."
          TITLE="Test APK - ${GITHUB_REF_NAME} - ${SHA}"
          # Create it if it is not there, otherwise retarget the one that is.
          # No delete: `upload --clobber` replaces the asset in place, so the
          # release never stops existing and there is no window with no APK.
          gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
              --title "$TITLE" --notes "$NOTES" \
            || gh release edit "$TAG" --prerelease --target "$GITHUB_SHA" \
              --title "$TITLE" --notes "$NOTES"
          gh release upload "$TAG" "$APK" --clobber
          # The Play Store bundle, when this run built one.
          AAB=build/app/outputs/bundle/release/app-release.aab
          if [ -f "$AAB" ]; then
            gh release upload "$TAG" "$AAB" --clobber
          fi

      - uses: actions/upload-artifact@v4
        # A convenience on the run page, nothing more. The release above is the
        # copy that matters, so the quota refusing this one must not fail the
        # run -- which is exactly what it did, three times, on a green build.
        continue-on-error: true
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: hazri-apk-${{ steps.name.outputs.sha }}
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          # Three days, not thirty. An APK is installed the day it is asked for;
          # thirty days meant a month of them alive at once.
          retention-days: 3

      - name: Report the APK size
        if: always()
        run: ls -lh build/app/outputs/flutter-apk/*.apk
