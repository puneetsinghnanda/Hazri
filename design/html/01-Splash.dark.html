<!doctype html>
<html><head><meta charset="utf-8"><title>Splash — first open</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Paaji+2:wght@500;600;700&amp;family=Mukta:wght@400;500;600;700&amp;family=Noto+Serif+Gurmukhi:wght@400;500;600;700&amp;family=Noto+Serif+Devanagari:wght@400;500;600&amp;display=swap">
  
  <style>
body{margin:0;background:#0C0F24}
a{color:#D9730D} a:hover{color:#9A4F00}
.app{--bg:#F4F3F8;--card:#FFFFFF;--card2:#ECEBF3;--ink:#1B1D3A;--ink2:#4D5070;--muted:#85879F;--rule:#E1E1EA;--primary:#262C63;--onPrimary:#FFFFFF;--kesri:#D9730D;--kesriSoft:#FBE8D2;--kesriInk:#9A4F00;--sage:#2E7A57;--sageSoft:#DCEFE5;--teal:#1F7A8C;--hl:#FBE5CB;--word:#A04F00;--shadow:0 1px 2px rgba(27,29,58,.06),0 10px 28px rgba(27,29,58,.07);--scrim:rgba(20,22,45,.45);
  width:390px;height:844px;background:var(--bg);color:var(--ink);font-family:Mukta,'Noto Sans Devanagari',system-ui,sans-serif;position:relative;overflow:hidden;box-sizing:border-box;font-size:15px;line-height:1.45}
.app.dark{--bg:#0C0F24;--card:#161A37;--card2:#1F2447;--ink:#EDECF6;--ink2:#B9BAD3;--muted:#8084A6;--rule:#2A2F55;--primary:#F2A24E;--onPrimary:#1C1206;--kesri:#F2A24E;--kesriSoft:#3A2A1A;--kesriInk:#FFC27E;--sage:#6CCB9C;--sageSoft:#173327;--teal:#6FC3D3;--hl:rgba(242,162,78,.17);--word:#FFC27E;--shadow:0 0 0 1px rgba(255,255,255,.04);--scrim:rgba(0,0,0,.55)}
.app *{box-sizing:border-box}
.gur{font-family:'Noto Serif Gurmukhi','Noto Sans Gurmukhi',serif}
.dev{font-family:'Noto Serif Devanagari','Noto Sans Devanagari',serif}
.disp{font-family:'Baloo Paaji 2',Mukta,system-ui,sans-serif}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
svg.i{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:16px;min-height:52px;font-weight:600;font-size:16px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
</style>

<style>body{margin:0;background:#888}</style></head><body>

<div class="app dark" style="width: 390px; height: 844px;">

<div style="position: absolute; left: -90px; right: -90px; bottom: -260px; height: 620px; border-radius: 50%; background: radial-gradient(closest-side, rgba(242,162,78,.55), rgba(242,162,78,.10) 60%, transparent);"></div>
<svg width="390" height="260" viewBox="0 0 390 260" style="position:absolute;left:0;bottom:0;display:block"><path d="M15 260a180 180 0 0 1 360 0" fill="none" stroke="#F2A24E" stroke-opacity=".45" stroke-width="1.5"/><path d="M65 260a130 130 0 0 1 260 0" fill="none" stroke="#F2A24E" stroke-opacity=".28" stroke-width="1.5"/><path d="M115 260a80 80 0 0 1 160 0" fill="none" stroke="#F2A24E" stroke-opacity=".18" stroke-width="1.5"/></svg>
