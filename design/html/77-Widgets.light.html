<!doctype html>
<html><head><meta charset="utf-8"><title>Home-screen widgets — light</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Paaji+2:wght@500;600;700&amp;family=Mukta:wght@400;500;600;700&amp;family=Noto+Serif+Gurmukhi:wght@400;500;600;700&amp;family=Noto+Serif+Devanagari:wght@400;500;600&amp;display=swap">
  <style>
body{margin:0;background:#888}
.app{--bg:#F4F3F8;--card:#FFFFFF;--card2:#ECEBF3;--ink:#1B1D3A;--ink2:#4D5070;--muted:#85879F;--rule:#E1E1EA;--primary:#262C63;--onPrimary:#FFFFFF;--kesri:#D9730D;--kesriSoft:#FBE8D2;--kesriInk:#9A4F00;--sage:#2E7A57;--sageSoft:#DCEFE5;--teal:#1F7A8C;--hl:#FBE5CB;--word:#A04F00;--simranField:#080B1C;--simranThread:#E8F4F8;--scrim:rgba(20,22,45,.45);--shadow:0 1px 2px rgba(27,29,58,.06),0 10px 28px rgba(27,29,58,.07);
  width:390px;height:844px;background:var(--bg);color:var(--ink);font-family:Mukta,'Noto Sans Devanagari',system-ui,sans-serif;position:relative;overflow:hidden;box-sizing:border-box;font-size:15px;line-height:1.45}
.app.dark{--bg:#0C0F24;--card:#161A37;--card2:#1F2447;--ink:#EDECF6;--ink2:#B9BAD3;--muted:#8084A6;--rule:#2A2F55;--primary:#F2A24E;--onPrimary:#1C1206;--kesri:#F2A24E;--kesriSoft:#3A2A1A;--kesriInk:#FFC27E;--sage:#6CCB9C;--sageSoft:#173327;--teal:#6FC3D3;--hl:rgba(242,162,78,.17);--word:#FFC27E;--simranField:#080B1C;--simranThread:#E8F4F8;--shadow:0 0 0 1px rgba(255,255,255,.04);}
.app *{box-sizing:border-box}
.gur{font-family:'Noto Serif Gurmukhi','Noto Sans Gurmukhi',serif}
.dev{font-family:'Noto Serif Devanagari','Noto Sans Devanagari',serif}
.disp{font-family:'Baloo Paaji 2',Mukta,system-ui,sans-serif}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
svg.i{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:16px;min-height:52px;font-weight:600;font-size:16px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.pad{padding:22px 20px 0}
.bar{height:9px;border-radius:5px;background:var(--card2)}
.tog{width:44px;height:26px;border-radius:13px;flex:none;position:relative}
.tog i{position:absolute;top:3px;width:20px;height:20px;border-radius:10px;background:#fff}
</style></head><body>
<div class="app light">

0 0 24 24"><path d="M8 5.5v13l10-6.5z" fill="currentColor" stroke="none"/></svg></div></div></div><div style="grid-column:span 4;height:132px;border-radius:22px;background:var(--card);box-shadow:var(--shadow);padding:14px 16px;overflow:hidden"><div class="col" style="height:100%;gap:6px"><div class="row" style="justify-content:space-between"><div style="font-size:12px;color:var(--muted);font-weight:600">Your goals</div><div style="font-size:12px;font-weight:700;color:var(--kesriInk)">1 of 3</div></div><div class="row" style="gap:8px"><div style="width:16px;height:16px;border-radius:8px;background:var(--sage);flex:none"></div><div style="font-size:13px;font-weight:600;flex:1">Japji Sahib</div><div style="font-size:11.5px;color:var(--muted)">done</div></div><div class="row" style="gap:8px"><div style="width:16px;height:16px;border-radius:8px;background:var(--rule);flex:none"></div><div style="font-size:13px;font-weight:600;flex:1">Simran</div><div style="font-size:11.5px;color:var(--muted)">11 min</div></div><div class="row" style="gap:8px"><div style="width:16px;height:16px;border-radius:8px;background:var(--rule);flex:none"></div><div style="font-size:13px;font-weight:600;flex:1">Rehras Sahib</div><div style="font-size:11.5px;color:var(--muted)">6:40 PM</div></div></div></div><div style="grid-column:span 4;height:132px;border-radius:22px;background:var(--card);box-shadow:var(--shadow);padding:14px 16px;overflow:hidden"><div class="col" style="height:100%;justify-content:space-between"><div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--kesriInk)">ਅੱਜ ਦਾ ਵਿਚਾਰ</div><div class="gur" style="font-size:16px;line-height:1.5">ਮਿਠਤੁ ਨੀਵੀ ਨਾਨਕਾ ਗੁਣ ਚੰਗਿਆਈਆ ਤਤੁ ॥</div><div style="font-size:12px;color:var(--ink2);line-height:1.4">Humility is sweetness, and it is the essence of true goodness.</div></div></div></div></div><div style="position:absolute;left:20px;right:20px;bottom:24px;height:72px;border-radius:26px;background:rgba(255,255,255,.35);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:space-around;padding:0 10px"><div style="width:50px;height:50px;border-radius:16px;background:var(--card);opacity:.85"></div><div style="width:50px;height:50px;border-radius:16px;background:var(--card);opacity:.85"></div><div style="width:50px;height:50px;border-radius:16px;background:var(--card);opacity:.85"></div><div style="width:50px;height:50px;border-radius:16px;background:var(--card);opacity:.85"></div></div>
