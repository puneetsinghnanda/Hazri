<!doctype html>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Paaji+2:wght@500;600;700&amp;family=Mukta:wght@400;500;600;700&amp;family=Noto+Serif+Gurmukhi:wght@400;500;600;700&amp;family=Noto+Serif+Devanagari:wght@400;500;600&amp;display=swap">
  <style>
body{margin:0;background:#888}
.app{--bg:#F4F3F8;--card:#FFFFFF;--card2:#ECEBF3;--ink:#1B1D3A;--ink2:#4D5070;--muted:#85879F;--rule:#E1E1EA;--primary:#262C63;--onPrimary:#FFFFFF;--kesri:#D9730D;--kesriSoft:#FBE8D2;--kesriInk:#9A4F00;--sage:#2E7A57;--sageSoft:#DCEFE5;--teal:#1F7A8C;--hl:#FBE5CB;--word:#A04F00;--simranField:#080B1C;--simranThread:#E8F4F8;--scrim:rgba(20,22,45,.45);--shadow:0 1px 2px rgba(27,29,58,.06),0 10px 28px rgba(27,29,58,.07);
  width:390px;height:844px;background:var(--bg);color:var(--ink);font-family:Mukta,'Noto Sans Devanagari',system-ui,sans-serif;position:relative;overflow:hidden;box-sizing:border-box;font-size:15px;line-height:1.45}

.gur{font-family:'Noto Serif Gurmukhi','Noto Sans Gurmukhi',serif}
.dev{font-family:'Noto Serif Devanagari','Noto Sans Devanagari',serif}
.disp{font-family:'Baloo Paaji 2',Mukta,system-ui,sans-serif}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
svg.i{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:16px;min-height:52px;font-weight:600;font-size:16px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.pad{padding:22px 20px 0}
.bar{height:9px;border-radius:5px;background:var(--card2)}
.tog{width:44px;height:26px;border-radius:13px;flex:none;position:relative}
.tog i{position:absolute;top:3px;width:20px;height:20px;border-radius:10px;background:#fff}

<div class="app light">
<div class="pad col" style="gap:10px"><div class="row" style="justify-content:space-between;gap:10px"><div class="row" style="gap:10px"><div style="width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--card);box-shadow:var(--shadow)"><svg class="i" width="20" height="20" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></div><div class="col" style="gap:0px"><div class="disp" style="font-size:24px;font-weight:700;line-height:1.15">Simran on your wrist</div><div style="font-size:12.5px;color:var(--muted);font-weight:500">Wear OS · Apple Watch after iOS</div></div></div><div style="width:44px"></div></div><div class="col" style="align-items:center;padding:6px 0 0"><div style="width:110px;height:120px;border-radius:40px 40px 0 0;background:#1B1D3A;margin-bottom:-24px;opacity:.9"></div><div style="width:300px;height:300px;border-radius:150px;background:#080B1C;box-shadow:0 30px 60px rgba(0,0,0,.45),inset 0 0 0 10px #1B1D3A;position:relative;display:flex;align-items:center;justify-content:center;color:#EDECF6"><svg width="300" height="300" viewBox="0 0 300 300" style="position:absolute;inset:0"><circle cx="150" cy="150" r="128" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="8"/><circle cx="150" cy="150" r="128" fill="none" stroke="#F2A24E" stroke-width="8" stroke-linecap="round" stroke-dasharray="402 804" transform="rotate(-90 150 150)"/></svg><div class="col" style="align-items:center;gap:6px;position:relative"><div style="font-size:11px;font-weight:700;letter-spacing:.1em;color:rgba(237,236,246,.55)">SIMRAN · 6:12 LEFT</div><div class="gur" style="font-size:30px;font-weight:600;color:#F2A24E">ਵਾਹਿਗੁਰੂ</div><div class="disp" style="font-size:64px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums">108</div><div style="font-size:12px;color:rgba(237,236,246,.6)">tap anywhere · one count</div></div><div style="position:absolute;bottom:26px;width:64px;height:30px;border-radius:15px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;color:#EDECF6"><svg class="i" width="16" height="16" viewBox="0 0 24 24"><rect x="6.5" y="5" width="3.8" height="14" rx="1.2" fill="currentColor" stroke="none"/><rect x="13.7" y="5" width="3.8" height="14" rx="1.2" fill="currentColor" stroke="none"/></svg></div></div><div style="width:110px;height:120px;border-radius:0 0 40px 40px;background:#1B1D3A;margin-top:-24px;opacity:.9"></div></div><div class="card row" style="padding:12px 14px;gap:10px;background:var(--card2);box-shadow:none"><div style="color:var(--muted);flex:none"><svg class="i" width="18" height="18" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="3"/><path d="M9 6.5V3.5h6v3M9 17.5v3h6v-3"/></svg></div><div style="font-size:12.5px;color:var(--ink2);line-height:1.5">Each tap is one count, with a light buzz. The count and the minutes reach the phone when they next meet, and the sitting is logged there as hazri.</div></div></div>
