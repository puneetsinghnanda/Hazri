<!doctype html>
<html><head><meta charset="utf-8"><title>ਹਾਜ਼ਰੀ ਲੱਗ ਗਈ — light</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Paaji+2:wght@500;600;700&amp;family=Mukta:wght@400;500;600;700&amp;family=Noto+Serif+Gurmukhi:wght@400;500;600;700&amp;family=Noto+Serif+Devanagari:wght@400;500;600&amp;display=swap">
  <style>
body{margin:0;background:#888}
.app{--bg:#F4F3F8;--card:#FFFFFF;--card2:#ECEBF3;--ink:#1B1D3A;--ink2:#4D5070;--muted:#85879F;--rule:#E1E1EA;--primary:#262C63;--onPrimary:#FFFFFF;--kesri:#D9730D;--kesriSoft:#FBE8D2;--kesriInk:#9A4F00;--sage:#2E7A57;--sageSoft:#DCEFE5;--teal:#1F7A8C;--hl:#FBE5CB;--word:#A04F00;--simranField:#080B1C;--simranThread:#E8F4F8;--scrim:rgba(20,22,45,.45);--shadow:0 1px 2px rgba(27,29,58,.06),0 10px 28px rgba(27,29,58,.07);
  width:390px;height:844px;background:var(--bg);color:var(--ink);font-family:Mukta,'Noto Sans Devanagari',system-ui,sans-serif;position:relative;overflow:hidden;box-sizing:border-box;font-size:15px;line-height:1.45}
.app.dark{--bg:#0C0F24;--card:#161A37;--card2:#1F2447;--ink:#EDECF6;--ink2:#B9BAD3;--muted:#8084A6;--rule:#2A2F55;--primary:#F2A24E;--onPrimary:#1C1206;--kesri:#F2A24E;--kesriSoft:#3A2A1A;--kesriInk:#FFC27E;--sage:#6CCB9C;--sageSoft:#173327;--teal:#6FC3D3;--hl:rgba(242,162,78,.17);--word:#FFC27E;--simranField:#080B1C;--simranThread:#E8F4F8;--shadow:0 0 0 1px rgba(255,255,255,.04);}
.app *{box-sizing:border-box}
.gur{font-family:'Noto Serif Gurmukhi','Noto Sans Gurmukhi',serif}
.dev{font-family:'Noto Serif Devanagari','Noto Sans Devanagari',serif}
.disp{font-family:'Baloo Paaji 2',Mukta,system-ui,sans-serif}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
svg.i{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:16px;min-height:52px;font-weight:600;font-size:16px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.pad{padding:22px 20px 0}
</style></head><body>
<div class="app light">

<div style="position:absolute;inset:0;background:#070A1A"></div>
<div style="position:absolute;left:50%;top:150px;transform:translate(-50%,-50%);
  width:460px;height:460px;border-radius:230px;
  background:radial-gradient(circle,rgba(242,162,78,.20),rgba(7,10,26,0) 62%)"></div>
<div style="position:absolute;inset:0;display:flex;flex-direction:column;
  padding:60px 24px 26px">
  <div class="col" style="align-items:center;gap:16px">
    <div style="width:104px;height:104px;border-radius:52px;
      background:rgba(255,255,255,.05);border:1px solid rgba(242,162,78,.35);
      display:flex;align-items:center;justify-content:center">
      <svg width="56" height="56" viewBox="0 0 40 40" style="display:block;flex:none"><path d="M4 27A16 16 0 0 1 36 27" fill="none" stroke="rgba(255,255,255,.78)" stroke-width="3.36" stroke-linecap="round"/><path d="M6 31.5H34" fill="none" stroke="rgba(255,255,255,.78)" stroke-width="3.36" stroke-linecap="round"/><path d="M12 27A8 8 0 0 1 28 27Z" fill="#F2A24E"/></svg></div>
    <div class="gur" style="font-size:30px;font-weight:600;color:#fff;
      text-align:center;line-height:1.4">ਹਾਜ਼ਰੀ ਲੱਗ ਗਈ</div>
    <div style="font-size:15px;color:rgba(255,255,255,.78);text-align:center;
      line-height:1.55">Your hazri is marked for today</div>
    <div class="row" style="gap:9px;align-items:center">
      <div style="font-size:12.5px;color:rgba(255,255,255,.5);font-weight:600">
        Friday, 20 November</div>
      <div style="width:3px;height:3px;border-radius:2px;
        background:rgba(255,255,255,.3)"></div>
      <div class="gur" style="font-size:12.5px;color:rgba(255,255,255,.5);
        font-weight:600">5 ਮੱਘਰ 558</div>
    </div>
  </div>
  <div style="height:26px"></div>
  <div style="border-radius:20px;background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.09);padding:6px 16px 8px"><div class="row" style="gap:11px;padding:9px 0"><div style="width:22px;height:22px;border-radius:11px;flex:none;background:rgba(108,203,156,.16);color:#6FE3A6;display:flex;align-items:center;justify-content:center"><svg class="i" width="13" height="13" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><div style="font-size:14.5px;font-weight:600;color:#EDECF6;flex:1">Japji Sahib</div><div style="font-size:13px;color:rgba(255,255,255,.55);font-weight:600">5:52 AM</div></div><div class="row" style="gap:11px;padding:9px 0"><div style="width:22px;height:22px;border-radius:11px;flex:none;background:rgba(108,203,156,.16);color:#6FE3A6;display:flex;align-items:center;justify-content:center"><svg class="i" width="13" height="13" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><div style="font-size:14.5px;font-weight:600;color:#EDECF6;flex:1">Naam Simran</div><div style="font-size:13px;color:rgba(255,255,255,.55);font-weight:600">11 minutes</div></div></div>
  <div style="font-size:13px;color:rgba(255,255,255,.55);text-align:center;
    line-height:1.6;padding:16px 4px 0">
    Read in the presence of Sri Guru Granth Sahib Ji</div>
  <div style="flex:1"></div>
  <div class="row" style="gap:9px;justify-content:center;padding-bottom:16px">
    <div style="font-size:13px;color:#F2A24E;font-weight:700">37 days in a row</div>
    <div style="width:3px;height:3px;border-radius:2px;
      background:rgba(255,255,255,.3)"></div>
    <div style="font-size:13px;color:rgba(255,255,255,.5);font-weight:600">
      a gentle streak</div>
  </div>
  <div class="btn" style="background:var(--kesri);color:#231104">
    <svg class="i" width="19" height="19" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><div>See my diary</div></div>
  <div style="text-align:center;font-size:14px;color:rgba(255,255,255,.55);
    font-weight:600;padding-top:16px">Done</div>
</div>
</div>
</body></html>
