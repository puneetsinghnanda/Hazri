<!doctype html>
<html><head><meta charset="utf-8"><title>Setup — your profile, the Hazri card — light</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Paaji+2:wght@500;600;700&amp;family=Mukta:wght@400;500;600;700&amp;family=Noto+Serif+Gurmukhi:wght@400;500;600;700&amp;family=Noto+Serif+Devanagari:wght@400;500;600&amp;display=swap">
  <style>
body{margin:0;background:#888}
.app{--bg:#F4F3F8;--card:#FFFFFF;--card2:#ECEBF3;--ink:#1B1D3A;--ink2:#4D5070;--muted:#85879F;--rule:#E1E1EA;--primary:#262C63;--onPrimary:#FFFFFF;--kesri:#D9730D;--kesriSoft:#FBE8D2;--kesriInk:#9A4F00;--sage:#2E7A57;--sageSoft:#DCEFE5;--teal:#1F7A8C;--hl:#FBE5CB;--word:#A04F00;--simranField:#080B1C;--simranThread:#E8F4F8;--scrim:rgba(20,22,45,.45);--shadow:0 1px 2px rgba(27,29,58,.06),0 10px 28px rgba(27,29,58,.07);
  width:390px;height:844px;background:var(--bg);color:var(--ink);font-family:Mukta,'Noto Sans Devanagari',system-ui,sans-serif;position:relative;overflow:hidden;box-sizing:border-box;font-size:15px;line-height:1.45}
.app.dark{--bg:#0C0F24;--card:#161A37;--card2:#1F2447;--ink:#EDECF6;--ink2:#B9BAD3;--muted:#8084A6;--rule:#2A2F55;--primary:#F2A24E;--onPrimary:#1C1206;--kesri:#F2A24E;--kesriSoft:#3A2A1A;--kesriInk:#FFC27E;--sage:#6CCB9C;--sageSoft:#173327;--teal:#6FC3D3;--hl:rgba(242,162,78,.17);--word:#FFC27E;--simranField:#080B1C;--simranThread:#E8F4F8;--shadow:0 0 0 1px rgba(255,255,255,.04);}
.app *{box-sizing:border-box}
.gur{font-family:'Noto Serif Gurmukhi','Noto Sans Gurmukhi',serif}
.dev{font-family:'Noto Serif Devanagari','Noto Sans Devanagari',serif}
.disp{font-family:'Baloo Paaji 2',Mukta,system-ui,sans-serif}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
svg.i{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:16px;min-height:52px;font-weight:600;font-size:16px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.pad{padding:22px 20px 0}
</style></head><body>
<div class="app light">


<style>
.app{--neela:#262C63;--edge:#C9C9D6;--plank:#DCDBE7}
.app.dark{--neela:#C9CCF2;--edge:#3D4372;--plank:#2A2F55}
.band{background:#262C63}.app.dark .band{background:var(--card2)}
.idcard{background:linear-gradient(150deg,#2E3577 0%,#262C63 55%,#1A1E48 100%);
  box-shadow:0 14px 30px rgba(38,44,99,.28)}
.app.dark .idcard{background:linear-gradient(150deg,#2A3170 0%,#1F2447 55%,#161A37 100%);
  box-shadow:0 0 0 1px rgba(255,255,255,.06)}
</style>
<div class="col" style="height:100%;padding:40px 20px 26px;gap:12px">
  <div class="row" style="justify-content:space-between"><div class="row" style="gap:6px"><div style="height:6px;border-radius:3px;width:12px;background:var(--kesri)"></div><div style="height:6px;border-radius:3px;width:12px;background:var(--kesri)"></div><div style="height:6px;border-radius:3px;width:28px;background:var(--kesri)"></div></div>
    <div style="font-size:15px;font-weight:700;color:var(--ink2)">Not now</div></div>
  <div class="disp" style="font-size:26px;font-weight:700;line-height:1.2;margin-top:4px">Make your Hazri card</div>
  <div style="font-size:13.5px;color:var(--ink2);line-height:1.45">Your name and city put you on the globe with the sangat.
    An email keeps your diary safe, if you add one.</div>
  <div class="idcard col" style="position:relative;overflow:hidden;border-radius:24px;padding:16px 18px;color:#fff;gap:8px">
    <div class="row" style="gap:8px"><svg width="22" height="22" viewBox="0 0 40 40" style="display:block;flex:none"><path d="M4 27A16 16 0 0 1 36 27" fill="none" stroke="#fff" stroke-width="1.32" stroke-linecap="round"/><path d="M6 31.5H34" fill="none" stroke="#fff" stroke-width="1.32" stroke-linecap="round"/><path d="M12 27A8 8 0 0 1 28 27Z" fill="#F2A24E"/></svg><div class="disp" style="font-size:16px;font-weight:700">Hazri</div></div>
    <div class="disp" style="font-size:26px;font-weight:700;line-height:1.1">Harpreet Kaur</div>
    <div class="row" style="gap:6px;font-size:13.5px;opacity:.85"><svg class="i" width="15" height="15" viewBox="0 0 24 24"><path d="M12 21s6.5-6 6.5-10.5a6.5 6.5 0 1 0-13 0C5.5 15 12 21 12 21z"/><circle cx="12" cy="10.3" r="2.4"/></svg>Ludhiana, Punjab</div>
    <div class="row" style="gap:6px;font-size:13.5px;opacity:.55"><svg class="i" width="15" height="15" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="3"/><path d="M4 8l8 5.5L20 8"/></svg>Your email</div>
  </div>
  <div class="card col" style="padding:20px 14px 14px;gap:18px">
    <div style="position:relative"><div style="position:absolute;left:12px;top:-9px;background:var(--card);padding:0 5px;font-size:12.5px;font-weight:700;line-height:18px;color:var(--ink2)">Name</div><div class="row" style="min-height:56px;border:1.5px solid var(--edge);border-radius:14px;gap:10px;padding:0 6px 0 14px"><div style="flex:1;min-width:0;font-size:16px;color:var(--ink)">Harpreet Kaur</div></div></div>
    <div style="position:relative"><div style="position:absolute;left:12px;top:-9px;background:var(--card);padding:0 5px;font-size:12.5px;font-weight:700;line-height:18px;color:var(--ink2)">City</div><div class="row" style="min-height:56px;border:1.5px solid var(--edge);border-radius:14px;gap:10px;padding:0 6px 0 14px"><div style="color:var(--neela)"><svg class="i" width="19" height="19" viewBox="0 0 24 24"><path d="M12 21s6.5-6 6.5-10.5a6.5 6.5 0 1 0-13 0C5.5 15 12 21 12 21z"/><circle cx="12" cy="10.3" r="2.4"/></svg></div><div style="flex:1;min-width:0;font-size:16px;color:var(--ink)">Ludhiana, Punjab</div><div style="color:var(--ink2);padding-right:8px"><svg class="i" width="18" height="18" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.3"/><path d="M15.4 15.4L20 20"/></svg></div></div></div>
    <div style="position:relative"><div style="position:absolute;left:12px;top:-9px;background:var(--card);padding:0 5px;font-size:12.5px;font-weight:700;line-height:18px;color:var(--neela)">Email (optional)</div><div class="row" style="min-height:56px;border:2px solid var(--neela);border-radius:14px;gap:10px;padding:0 6px 0 14px"><div style="flex:1;min-width:0;font-size:16px;color:var(--muted)">you@example.com</div></div></div>
  </div>
  <div style="flex:1"></div>
  <div class="btn" style="background:var(--primary);color:var(--onPrimary)"><div>Create my profile</div></div>
</div></div>
</body></html>
