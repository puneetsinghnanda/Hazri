<!doctype html>
<html><head><meta charset="utf-8"><title>Gurmat Quiz — a question, answered — dark</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Paaji+2:wght@500;600;700&amp;family=Mukta:wght@400;500;600;700&amp;family=Noto+Serif+Gurmukhi:wght@400;500;600;700&amp;family=Noto+Serif+Devanagari:wght@400;500;600&amp;display=swap">
  <style>
body{margin:0;background:#888}
.app{--bg:#F4F3F8;--card:#FFFFFF;--card2:#ECEBF3;--ink:#1B1D3A;--ink2:#4D5070;--muted:#85879F;--rule:#E1E1EA;--primary:#262C63;--onPrimary:#FFFFFF;--kesri:#D9730D;--kesriSoft:#FBE8D2;--kesriInk:#9A4F00;--sage:#2E7A57;--sageSoft:#DCEFE5;--teal:#1F7A8C;--hl:#FBE5CB;--word:#A04F00;--simranField:#080B1C;--simranThread:#E8F4F8;--scrim:rgba(20,22,45,.45);--shadow:0 1px 2px rgba(27,29,58,.06),0 10px 28px rgba(27,29,58,.07);
  width:390px;height:844px;background:var(--bg);color:var(--ink);font-family:Mukta,'Noto Sans Devanagari',system-ui,sans-serif;position:relative;overflow:hidden;box-sizing:border-box;font-size:15px;line-height:1.45}
.app.dark{--bg:#0C0F24;--card:#161A37;--card2:#1F2447;--ink:#EDECF6;--ink2:#B9BAD3;--muted:#8084A6;--rule:#2A2F55;--primary:#F2A24E;--onPrimary:#1C1206;--kesri:#F2A24E;--kesriSoft:#3A2A1A;--kesriInk:#FFC27E;--sage:#6CCB9C;--sageSoft:#173327;--teal:#6FC3D3;--hl:rgba(242,162,78,.17);--word:#FFC27E;--simranField:#080B1C;--simranThread:#E8F4F8;--shadow:0 0 0 1px rgba(255,255,255,.04);}
.app *{box-sizing:border-box}
.gur{font-family:'Noto Serif Gurmukhi','Noto Sans Gurmukhi',serif}
.dev{font-family:'Noto Serif Devanagari','Noto Sans Devanagari',serif}
.disp{font-family:'Baloo Paaji 2',Mukta,system-ui,sans-serif}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
svg.i{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:16px;min-height:52px;font-weight:600;font-size:16px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.pad{padding:22px 20px 0}
</style></head><body>
<div class="app dark">

<div class="row" style="gap:10px;padding:16px 18px 12px"><div style="width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--card);box-shadow:var(--shadow);flex:none"><svg class="i" width="20" height="20" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></div><div class="col"><div class="disp" style="font-size:19px;font-weight:700;line-height:1.15">Guru Ram Das Ji</div><div style="font-size:12.5px;color:var(--muted);font-weight:600">Question 2 of 5</div></div></div>
<div style="margin:0 20px;height:6px;border-radius:4px;background:var(--card2);overflow:hidden">
  <div style="width:40%;height:100%;background:var(--kesri);border-radius:4px"></div></div>
<div class="col" style="padding:18px 20px 0;gap:10px">
  <div class="disp" style="font-size:21px;font-weight:700;line-height:1.3;margin-bottom:8px">
    In which city was Guru Ram Das Ji born?</div>
  <div class="row" style="gap:12px;min-height:56px;padding:8px 14px;border-radius:16px;background:var(--card);border:1.5px solid var(--rule);color:var(--muted);font-size:16px;font-weight:600"><div style="width:30px;height:30px;border-radius:15px;flex:none;background:var(--card2);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700">A</div>Goindwal</div><div class="row" style="gap:12px;min-height:56px;padding:8px 14px;border-radius:16px;background:var(--card);border:1.5px solid var(--rule);color:var(--muted);font-size:16px;font-weight:600"><div style="width:30px;height:30px;border-radius:15px;flex:none;background:var(--card2);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700">B</div>Khadur Sahib</div><div class="row" style="gap:12px;min-height:56px;padding:8px 14px;border-radius:16px;background:var(--sageSoft);border:1.5px solid var(--sage);color:var(--ink);font-size:16px;font-weight:600"><div style="width:30px;height:30px;border-radius:15px;flex:none;background:var(--sage);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700"><svg class="i" width="14" height="14" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>Lahore</div><div class="row" style="gap:12px;min-height:56px;padding:8px 14px;border-radius:16px;background:var(--card);border:1.5px solid var(--rule);color:var(--muted);font-size:16px;font-weight:600"><div style="width:30px;height:30px;border-radius:15px;flex:none;background:var(--card2);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700">D</div>Kartarpur</div>
  <div class="card col" style="background:var(--sageSoft);box-shadow:none;padding:14px 16px;gap:4px;margin-top:4px">
    <div style="font-weight:700;color:var(--sage)">Right</div>
    <div style="font-size:14px;line-height:1.45;color:var(--ink2)">Guru Ram Das Ji was born in Chuna Mandi,
      Lahore (now in Pakistan), to Baba Hari Das and Mata Daya Kaur.</div>
  </div>
</div>
<div style="position:absolute;left:20px;right:20px;bottom:24px">
  <div class="btn" style="background:var(--primary);color:var(--onPrimary)">Next</div></div>
</div>
</body></html>
