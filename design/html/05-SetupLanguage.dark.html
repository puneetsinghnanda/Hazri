<!doctype html>
<html><head><meta charset="utf-8"><title>1 · Setup — language</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Paaji+2:wght@500;600;700&amp;family=Mukta:wght@400;500;600;700&amp;family=Noto+Serif+Gurmukhi:wght@400;500;600;700&amp;family=Noto+Serif+Devanagari:wght@400;500;600&amp;display=swap">
  
  <style>
body{margin:0;background:#0C0F24}
a{color:#D9730D} a:hover{color:#9A4F00}
.app{--bg:#F4F3F8;--card:#FFFFFF;--card2:#ECEBF3;--ink:#1B1D3A;--ink2:#4D5070;--muted:#85879F;--rule:#E1E1EA;--primary:#262C63;--onPrimary:#FFFFFF;--kesri:#D9730D;--kesriSoft:#FBE8D2;--kesriInk:#9A4F00;--sage:#2E7A57;--sageSoft:#DCEFE5;--teal:#1F7A8C;--hl:#FBE5CB;--word:#A04F00;--shadow:0 1px 2px rgba(27,29,58,.06),0 10px 28px rgba(27,29,58,.07);--scrim:rgba(20,22,45,.45);
  width:390px;height:844px;background:var(--bg);color:var(--ink);font-family:Mukta,'Noto Sans Devanagari',system-ui,sans-serif;position:relative;overflow:hidden;box-sizing:border-box;font-size:15px;line-height:1.45}
.app.dark{--bg:#0C0F24;--card:#161A37;--card2:#1F2447;--ink:#EDECF6;--ink2:#B9BAD3;--muted:#8084A6;--rule:#2A2F55;--primary:#F2A24E;--onPrimary:#1C1206;--kesri:#F2A24E;--kesriSoft:#3A2A1A;--kesriInk:#FFC27E;--sage:#6CCB9C;--sageSoft:#173327;--teal:#6FC3D3;--hl:rgba(242,162,78,.17);--word:#FFC27E;--shadow:0 0 0 1px rgba(255,255,255,.04);--scrim:rgba(0,0,0,.55)}
.app *{box-sizing:border-box}
.gur{font-family:'Noto Serif Gurmukhi','Noto Sans Gurmukhi',serif}
.dev{font-family:'Noto Serif Devanagari','Noto Sans Devanagari',serif}
.disp{font-family:'Baloo Paaji 2',Mukta,system-ui,sans-serif}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
svg.i{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:16px;min-height:52px;font-weight:600;font-size:16px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
</style>

<style>body{margin:0;background:#888}</style></head><body>

<div class="app dark" style="width: 390px; height: 844px;">

<div style="display: flex; flex-direction: column; height: 100%; padding: 40px 24px 30px;">
  <div style="display: flex; gap: 6px;"><div style="height: 6px; border-radius: 3px; width: 28px; background: var(--kesri);"></div><div style="height: 6px; border-radius: 3px; width: 12px; background: var(--rule);"></div><div style="height: 6px; border-radius: 3px; width: 12px; background: var(--rule);"></div></div>

    <svg width="64" height="64" viewBox="0 0 40 40" style="display:block;flex:none"><path d="M4 27a16 16 0 0 1 32 0" fill="none" stroke="var(--primary)" stroke-width="2.4" stroke-linecap="round"/><path d="M12 27a8 8 0 0 1 16 0z" fill="var(--kesri)"/><path d="M6 31.5h28" stroke="var(--primary)" stroke-width="2.4" stroke-linecap="round"/></svg>

    <div style="font-size: 17px; color: var(--ink2); line-height: 1.45; max-width: 290px;">Your daily Nitnem — always with you.</div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 30px;">
    <div class="eyebrow">Choose your language</div>
    <div style="display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-radius: 18px; min-height: 72px; background: var(--card); box-shadow: var(--shadow);"><div style="flex: 1; display: flex; flex-direction: column;"><div class="disp" style="font-size: 22px; font-weight: 700; line-height: 1.3;">ਪੰਜਾਬੀ</div><div style="font-size: 13px; color: var(--muted);">Punjabi</div></div><div style="width: 24px; height: 24px; border-radius: 12px; border: 2px solid var(--rule);"></div></div>
    <div style="display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-radius: 18px; min-height: 72px; background: var(--card); box-shadow: var(--shadow);"><div style="flex: 1; display: flex; flex-direction: column;"><div class="" style="font-size: 22px; font-weight: 700; line-height: 1.3;">हिन्दी</div><div style="font-size: 13px; color: var(--muted);">Hindi</div></div><div style="width: 24px; height: 24px; border-radius: 12px; border: 2px solid var(--rule);"></div></div>
    <div style="display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-radius: 18px; min-height: 72px; box-shadow: inset 0 0 0 2px var(--kesri); background: var(--card);"><div style="flex: 1; display: flex; flex-direction: column;"><div class="" style="font-size: 22px; font-weight: 700; line-height: 1.3;">English</div><div style="font-size: 13px; color: var(--muted);">English</div></div><div style="width: 24px; height: 24px; border-radius: 12px; background: var(--kesri); display: flex; align-items: center; justify-content: center; color: #fff;"><svg class="i" width="16" height="16" viewBox="0 0 24 24" style=""><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div></div>
  </div>
  <div style="flex: 1;"></div>
  <div style="display: flex; justify-content: center; gap: 14px; font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 14px;"><div>Works offline</div><div>·</div><div>No login</div><div>·</div><div>No ads on Gurbani</div></div>
  <div class="btn" style="background: var(--primary); color: var(--onPrimary);">Continue</div>
</div>
</div>
