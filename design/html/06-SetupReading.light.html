<!doctype html>
<html><head><meta charset="utf-8"><title>2 · Setup — reading</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Paaji+2:wght@500;600;700&amp;family=Mukta:wght@400;500;600;700&amp;family=Noto+Serif+Gurmukhi:wght@400;500;600;700&amp;family=Noto+Serif+Devanagari:wght@400;500;600&amp;display=swap">
  
  <style>
body{margin:0;background:#0C0F24}
a{color:#D9730D} a:hover{color:#9A4F00}
.app{--bg:#F4F3F8;--card:#FFFFFF;--card2:#ECEBF3;--ink:#1B1D3A;--ink2:#4D5070;--muted:#85879F;--rule:#E1E1EA;--primary:#262C63;--onPrimary:#FFFFFF;--kesri:#D9730D;--kesriSoft:#FBE8D2;--kesriInk:#9A4F00;--sage:#2E7A57;--sageSoft:#DCEFE5;--teal:#1F7A8C;--hl:#FBE5CB;--word:#A04F00;--shadow:0 1px 2px rgba(27,29,58,.06),0 10px 28px rgba(27,29,58,.07);--scrim:rgba(20,22,45,.45);
  width:390px;height:844px;background:var(--bg);color:var(--ink);font-family:Mukta,'Noto Sans Devanagari',system-ui,sans-serif;position:relative;overflow:hidden;box-sizing:border-box;font-size:15px;line-height:1.45}
.app.dark{--bg:#0C0F24;--card:#161A37;--card2:#1F2447;--ink:#EDECF6;--ink2:#B9BAD3;--muted:#8084A6;--rule:#2A2F55;--primary:#F2A24E;--onPrimary:#1C1206;--kesri:#F2A24E;--kesriSoft:#3A2A1A;--kesriInk:#FFC27E;--sage:#6CCB9C;--sageSoft:#173327;--teal:#6FC3D3;--hl:rgba(242,162,78,.17);--word:#FFC27E;--shadow:0 0 0 1px rgba(255,255,255,.04);--scrim:rgba(0,0,0,.55)}
.app *{box-sizing:border-box}
.gur{font-family:'Noto Serif Gurmukhi','Noto Sans Gurmukhi',serif}
.dev{font-family:'Noto Serif Devanagari','Noto Sans Devanagari',serif}
.disp{font-family:'Baloo Paaji 2',Mukta,system-ui,sans-serif}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
svg.i{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:16px;min-height:52px;font-weight:600;font-size:16px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
</style>

<style>body{margin:0;background:#888}</style></head><body>

<div class="app light" style="width: 390px; height: 844px;">

<div style="display: flex; flex-direction: column; height: 100%; padding: 40px 24px 30px; gap: 16px;">
  <div style="display: flex; gap: 6px;"><div style="height: 6px; border-radius: 3px; width: 12px; background: var(--kesri);"></div><div style="height: 6px; border-radius: 3px; width: 28px; background: var(--kesri);"></div><div style="height: 6px; border-radius: 3px; width: 12px; background: var(--rule);"></div></div>
  <div class="disp" style="font-size: 28px; font-weight: 700; line-height: 1.2; margin-top: 10px;">How do you like to read Gurbani?</div>
  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 16px; border-radius: 16px; background: var(--card); box-shadow: inset 0 0 0 2px var(--kesri);"><div style="font-size: 12px; color: var(--muted); font-weight: 700;">GURMUKHI</div><div class="gur" style="font-size: 19px; line-height: 1.6; font-weight: 500;">ਆਦਿ ਸਚੁ ਜੁਗਾਦਿ ਸਚੁ ॥</div></div>
    <div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 16px; border-radius: 16px; background: var(--card); box-shadow: var(--shadow);"><div style="font-size: 12px; color: var(--muted); font-weight: 700;">हिन्दी · DEVANAGARI</div><div class="dev" style="font-size: 19px; line-height: 1.6; font-weight: 500;">आदि सचु जुगादि सचु ॥</div></div>
    <div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 16px; border-radius: 16px; background: var(--card); box-shadow: var(--shadow);"><div style="font-size: 12px; color: var(--muted); font-weight: 700;">ROMAN</div><div class="" style="font-size: 19px; line-height: 1.6; font-weight: 500;">aad sach jugaad sach ||</div></div>
  </div>
  <div class="card" style="padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 600;"><div>Text size</div><div style="color: var(--muted);">Large</div></div>
    <div style="display: flex; align-items: center; gap: 12px;"><div style="font-size: 13px; font-weight: 700; color: var(--muted);">A</div><div style="flex: 1; height: 4px; border-radius: 2px; background: var(--rule); position: relative;"><div style="width: 62%; height: 4px; border-radius: 2px; background: var(--kesri);"></div><div style="position: absolute; left: 62%; top: -8px; width: 20px; height: 20px; margin-left: -10px; border-radius: 10px; background: var(--card); box-shadow: 0 0 0 2px var(--kesri);"></div></div><div style="font-size: 22px; font-weight: 700; color: var(--muted);">A</div></div>
    <div style="display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--rule); padding-top: 10px;"><div style="flex: 1; display: flex; flex-direction: column;"><div style="font-size: 15px; font-weight: 600;">Elder mode</div><div style="font-size: 12.5px; color: var(--muted);">Extra-large text and big buttons</div></div><div style="width: 48px; height: 28px; border-radius: 14px; background: var(--card2); padding: 4px; flex: none; display: flex;"><div style="width: 20px; height: 20px; border-radius: 10px; background: var(--muted); "></div></div></div>
  </div>
  <div style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink2);"><div style="color: var(--kesriInk);"><svg class="i" width="18" height="18" viewBox="0 0 24 24" style=""><path d="M12 6.5C10.5 5.2 8 4.5 4 4.5v13c4 0 6.5.7 8 2 1.5-1.3 4-2 8-2v-13c-4 0-6.5.7-8 2z"/><path d="M12 6.5v13"/></svg></div><div style="flex: 1;">Bani versions follow the SGPC Rehat Maryada</div><a style="font-weight: 700;">Change</a></div>
  <div style="flex: 1;"></div>
  <div class="btn" style="background: var(--primary); color: var(--onPrimary);">Continue</div>
</div>
</div>
