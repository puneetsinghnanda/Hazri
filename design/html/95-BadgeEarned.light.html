<!doctype html>
<html><head><meta charset="utf-8"><title>Badges — one earned — light</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Paaji+2:wght@500;600;700&amp;family=Mukta:wght@400;500;600;700&amp;family=Noto+Serif+Gurmukhi:wght@400;500;600;700&amp;family=Noto+Serif+Devanagari:wght@400;500;600&amp;display=swap">
  <style>
body{margin:0;background:#888}
.app{--bg:#F4F3F8;--card:#FFFFFF;--card2:#ECEBF3;--ink:#1B1D3A;--ink2:#4D5070;--muted:#85879F;--rule:#E1E1EA;--primary:#262C63;--onPrimary:#FFFFFF;--kesri:#D9730D;--kesriSoft:#FBE8D2;--kesriInk:#9A4F00;--sage:#2E7A57;--sageSoft:#DCEFE5;--teal:#1F7A8C;--hl:#FBE5CB;--word:#A04F00;--simranField:#080B1C;--simranThread:#E8F4F8;--scrim:rgba(20,22,45,.45);--shadow:0 1px 2px rgba(27,29,58,.06),0 10px 28px rgba(27,29,58,.07);
  width:390px;height:844px;background:var(--bg);color:var(--ink);font-family:Mukta,'Noto Sans Devanagari',system-ui,sans-serif;position:relative;overflow:hidden;box-sizing:border-box;font-size:15px;line-height:1.45}
.app.dark{--bg:#0C0F24;--card:#161A37;--card2:#1F2447;--ink:#EDECF6;--ink2:#B9BAD3;--muted:#8084A6;--rule:#2A2F55;--primary:#F2A24E;--onPrimary:#1C1206;--kesri:#F2A24E;--kesriSoft:#3A2A1A;--kesriInk:#FFC27E;--sage:#6CCB9C;--sageSoft:#173327;--teal:#6FC3D3;--hl:rgba(242,162,78,.17);--word:#FFC27E;--simranField:#080B1C;--simranThread:#E8F4F8;--shadow:0 0 0 1px rgba(255,255,255,.04);}
.app *{box-sizing:border-box}
.gur{font-family:'Noto Serif Gurmukhi','Noto Sans Gurmukhi',serif}
.dev{font-family:'Noto Serif Devanagari','Noto Sans Devanagari',serif}
.disp{font-family:'Baloo Paaji 2',Mukta,system-ui,sans-serif}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
svg.i{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:16px;min-height:52px;font-weight:600;font-size:16px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.pad{padding:22px 20px 0}
</style></head><body>
<div class="app light">


<style>.band{background:#262C63}.app.dark .band{background:var(--card2)}</style>
<div class="band" style="position:absolute;left:0;right:0;top:0;height:190px;border-radius:0 0 28px 28px"></div>
<div style="position:absolute;left:20px;right:20px;top:158px;height:74px;border-radius:20px;
  background:linear-gradient(135deg,var(--kesri),#B8560A)"></div>
<div style="position:absolute;left:20px;right:20px;top:246px;height:82px;border-radius:20px;background:var(--card)"></div>
<div style="position:absolute;left:20px;right:20px;top:342px;height:150px;border-radius:20px;background:var(--card)"></div>
<div style="position:absolute;inset:0;background:var(--scrim)"></div>
<div class="col" style="position:absolute;left:0;right:0;bottom:0;background:var(--card);
  border-radius:28px 28px 0 0;padding:12px 22px 30px;gap:16px">
  <div class="row" style="justify-content:center"><div style="width:40px;height:4px;border-radius:2px;background:var(--rule)"></div></div>
  <div class="row" style="gap:16px;margin-top:8px">
    <div style="width:84px;height:84px;flex:none;border-radius:42px;background:radial-gradient(circle at 35% 30%,#F7B76A,#D9730D 70%);box-shadow:0 0 0 5px var(--kesriSoft);display:flex;align-items:center;justify-content:center"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3M18 3v4h-4M6 21v-4h4"/></svg></div>
    <div class="col">
      <div class="eyebrow" style="color:var(--kesriInk);font-weight:700">New badge</div>
      <div class="row" style="gap:8px;align-items:baseline;flex-wrap:wrap">
        <div class="disp" style="font-size:25px;font-weight:700;line-height:1.15">Abhyasi</div>
        <div class="gur" style="font-size:18px;font-weight:600;color:var(--kesriInk)">ਅਭਿਆਸੀ</div></div>
      <div style="font-size:14px;color:var(--ink2);line-height:1.4">One who practises: hazri on 40 days</div>
    </div>
  </div>
  <div class="col" style="gap:10px;padding:14px;border-radius:18px;background:var(--bg)">
    <div class="row" style="justify-content:space-between;font-size:13.5px;font-weight:700">
      <span>Your badges</span><span style="color:var(--muted);font-weight:600">4 of 10</span></div>
    <div style="display:grid;grid-template-columns:repeat(10,1fr);gap:6px"><div style="aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#F7B76A,#D9730D 70%);box-shadow:0 0 0 2px var(--kesriSoft);display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17h18M7 17a5 5 0 0 1 10 0M12 7v3M6.5 10.5l1.5 1.5M17.5 10.5L16 12"/></svg></div><div style="aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#F7B76A,#D9730D 70%);box-shadow:0 0 0 2px var(--kesriSoft);display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></div><div style="aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#F7B76A,#D9730D 70%);box-shadow:0 0 0 2px var(--kesriSoft);display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3M18 3v4h-4M6 21v-4h4"/></svg></div><div style="aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#F7B76A,#D9730D 70%);box-shadow:0 0 0 2px var(--kesriSoft);display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10.5 5.2 8 4.5 4 4.5v13c4 0 6.5.7 8 2 1.5-1.3 4-2 8-2v-13c-4 0-6.5.7-8 2zM12 6.5v13"/></svg></div><div style="aspect-ratio:1;border-radius:50%;background:var(--card2);box-shadow:inset 0 0 0 1px var(--rule);display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4a8 8 0 1 1-.01 0M12 20v2.5"/></svg></div><div style="aspect-ratio:1;border-radius:50%;background:var(--card2);box-shadow:inset 0 0 0 1px var(--rule);display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11M13 4v6l2-1.5L17 10V4"/></svg></div><div style="aspect-ratio:1;border-radius:50%;background:var(--card2);box-shadow:inset 0 0 0 1px var(--rule);display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15h4l3 2h6a2 2 0 0 0 0-4h-3M12 10.5s-3-1.9-3-4.2A1.8 1.8 0 0 1 12 5a1.8 1.8 0 0 1 3 1.3c0 2.3-3 4.2-3 4.2z"/></svg></div><div style="aspect-ratio:1;border-radius:50%;background:var(--card2);box-shadow:inset 0 0 0 1px var(--rule);display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM12 2.5V5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg></div><div style="aspect-ratio:1;border-radius:50%;background:var(--card2);box-shadow:inset 0 0 0 1px var(--rule);display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM6.5 20a5.5 5.5 0 0 1 11 0M5 11.5a2.2 2.2 0 1 0 0-4.4M2 17.5a4 4 0 0 1 3-3.6M19 11.5a2.2 2.2 0 1 1 0-4.4M22 17.5a4 4 0 0 0-3-3.6"/></svg></div><div style="aspect-ratio:1;border-radius:50%;background:var(--card2);box-shadow:inset 0 0 0 1px var(--rule);display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19l6-8 4 5 3-3 5 6zM16 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></svg></div></div>
  </div>
  <div class="row" style="gap:10px;margin-top:6px">
    <div class="btn" style="flex:1;background:var(--card2);color:var(--ink2)">Done</div>
    <div class="btn" style="flex:1.4;background:var(--primary);color:var(--onPrimary)">See all badges</div>
  </div>
</div>
</div>
</body></html>
