  <style>
body{margin:0;background:#888}
.app{--bg:#F4F3F8;--card:#FFFFFF;--card2:#ECEBF3;--ink:#1B1D3A;--ink2:#4D5070;--muted:#85879F;--rule:#E1E1EA;--primary:#262C63;--onPrimary:#FFFFFF;--kesri:#D9730D;--kesriSoft:#FBE8D2;--kesriInk:#9A4F00;--sage:#2E7A57;--sageSoft:#DCEFE5;--teal:#1F7A8C;--hl:#FBE5CB;--word:#A04F00;--simranField:#080B1C;--simranThread:#E8F4F8;--scrim:rgba(20,22,45,.45);--shadow:0 1px 2px rgba(27,29,58,.06),0 10px 28px rgba(27,29,58,.07);
  width:390px;height:844px;background:var(--bg);color:var(--ink);font-family:Mukta,'Noto Sans Devanagari',system-ui,sans-serif;position:relative;overflow:hidden;box-sizing:border-box;font-size:15px;line-height:1.45}

.app *{box-sizing:border-box}
.gur{font-family:'Noto Serif Gurmukhi','Noto Sans Gurmukhi',serif}
.dev{font-family:'Noto Serif Devanagari','Noto Sans Devanagari',serif}
.disp{font-family:'Baloo Paaji 2',Mukta,system-ui,sans-serif}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
svg.i{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:16px;min-height:52px;font-weight:600;font-size:16px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.pad{padding:22px 20px 0}
.bar{height:9px;border-radius:5px;background:var(--card2)}
.tog{width:44px;height:26px;border-radius:13px;flex:none;position:relative}
.tog i{position:absolute;top:3px;width:20px;height:20px;border-radius:10px;background:#fff}
</style></head><body>
<div class="app dark">
<div class="pad col" style="gap:12px"><div class="row" style="justify-content:space-between;gap:10px"><div class="row" style="gap:10px"><div style="width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--card);box-shadow:var(--shadow)"><svg class="i" width="20" height="20" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></div><div class="col" style="gap:0px"><div class="disp" style="font-size:24px;font-weight:700;line-height:1.15">Saakhi</div><div style="font-size:12.5px;color:var(--muted);font-weight:500">For children · 4 min</div></div></div><div style="width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--ink);box-shadow:var(--shadow);flex:none"><svg class="i" width="20" height="20" viewBox="0 0 24 24"><path d="M12 3.5v11M8 7.5l4-4 4 4"/><path d="M5 12.5v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></div></div><div style="height:150px;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,var(--primary),#0E1533);position:relative;flex:none"><svg width="100%" height="150" viewBox="0 0 320 150" preserveAspectRatio="xMidYMid slice" style="display:block"><circle cx="250" cy="75" r="26" fill="none" stroke="rgba(242,162,78,0.40)" stroke-width="1.4"/><circle cx="250" cy="75" r="43" fill="none" stroke="rgba(242,162,78,0.36)" stroke-width="1.4"/><circle cx="250" cy="75" r="60" fill="none" stroke="rgba(242,162,78,0.31)" stroke-width="1.4"/><circle cx="250" cy="75" r="77" fill="none" stroke="rgba(242,162,78,0.27)" stroke-width="1.4"/><circle cx="250" cy="75" r="94" fill="none" stroke="rgba(242,162,78,0.22)" stroke-width="1.4"/><circle cx="250" cy="75" r="111" fill="none" stroke="rgba(242,162,78,0.18)" stroke-width="1.4"/><circle cx="250" cy="75" r="128" fill="none" stroke="rgba(242,162,78,0.13)" stroke-width="1.4"/><circle cx="250" cy="75" r="145" fill="none" stroke="rgba(242,162,78,0.09)" stroke-width="1.4"/></svg></div><div class="col" style="gap:6px"><div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)">Guru Nanak Dev Ji</div><div class="disp" style="font-size:24px;font-weight:700;line-height:1.2">[Title from hazri.app]</div></div><div class="card row" style="padding:10px 14px;gap:12px"><div style="width:40px;height:40px;border-radius:20px;background:var(--kesri);color:#fff;display:flex;align-items:center;justify-content:center;flex:none"><svg class="i" width="18" height="18" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z" fill="currentColor" stroke="none"/></svg></div><div class="col" style="flex:1;gap:5px"><div style="font-size:13px;font-weight:600">Read aloud · 6 min</div><div style="height:4px;border-radius:2px;background:var(--card2)"><div style="width:0%;height:100%;background:var(--kesri)"></div></div></div><div style="font-size:12px;color:var(--muted);font-weight:600">A person’s voice</div></div><div class="col" style="gap:10px"><div class="bar" style="width:100%;height:10px"></div><div class="bar" style="width:96%;height:10px"></div><div class="bar" style="width:88%;height:10px"></div><div class="bar" style="width:100%;height:10px"></div><div class="bar" style="width:72%;height:10px"></div></div><div class="col" style="gap:10px"><div class="bar" style="width:100%;height:10px"></div><div class="bar" style="width:94%;height:10px"></div><div class="bar" style="width:100%;height:10px"></div><div class="bar" style="width:60%;height:10px"></div></div><div class="card col" style="padding:12px 14px;gap:4px;background:var(--kesriSoft);box-shadow:none"><div style="font-size:12px;font-weight:700;color:var(--kesriInk)">What this teaches</div><div class="bar" style="width:90%;background:rgba(154,79,0,.18)"></div></div></div>
