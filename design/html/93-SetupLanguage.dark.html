<!doctype html>
<html><head><meta charset="utf-8"><title>First run — Language — dark</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Paaji+2:wght@500;600;700&amp;family=Mukta:wght@400;500;600;700&amp;family=Noto+Serif+Gurmukhi:wght@400;500;600;700&amp;family=Noto+Serif+Devanagari:wght@400;500;600&amp;display=swap">
  <style>
body{margin:0;background:#888}
.app{--bg:#F4F3F8;--card:#FFFFFF;--card2:#ECEBF3;--ink:#1B1D3A;--ink2:#4D5070;--muted:#85879F;--rule:#E1E1EA;--primary:#262C63;--onPrimary:#FFFFFF;--kesri:#D9730D;--kesriSoft:#FBE8D2;--kesriInk:#9A4F00;--sage:#2E7A57;--sageSoft:#DCEFE5;--teal:#1F7A8C;--hl:#FBE5CB;--word:#A04F00;--simranField:#080B1C;--simranThread:#E8F4F8;--scrim:rgba(20,22,45,.45);--shadow:0 1px 2px rgba(27,29,58,.06),0 10px 28px rgba(27,29,58,.07);
  width:390px;height:844px;background:var(--bg);color:var(--ink);font-family:Mukta,'Noto Sans Devanagari',system-ui,sans-serif;position:relative;overflow:hidden;box-sizing:border-box;font-size:15px;line-height:1.45}
.app.dark{--bg:#0C0F24;--card:#161A37;--card2:#1F2447;--ink:#EDECF6;--ink2:#B9BAD3;--muted:#8084A6;--rule:#2A2F55;--primary:#F2A24E;--onPrimary:#1C1206;--kesri:#F2A24E;--kesriSoft:#3A2A1A;--kesriInk:#FFC27E;--sage:#6CCB9C;--sageSoft:#173327;--teal:#6FC3D3;--hl:rgba(242,162,78,.17);--word:#FFC27E;--simranField:#080B1C;--simranThread:#E8F4F8;--shadow:0 0 0 1px rgba(255,255,255,.04);}
.app *{box-sizing:border-box}
.gur{font-family:'Noto Serif Gurmukhi','Noto Sans Gurmukhi',serif}
.dev{font-family:'Noto Serif Devanagari','Noto Sans Devanagari',serif}
.disp{font-family:'Baloo Paaji 2',Mukta,system-ui,sans-serif}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
svg.i{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:16px;min-height:52px;font-weight:600;font-size:16px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.pad{padding:22px 20px 0}
</style></head><body>
<div class="app dark">

<div class="col" style="height:100%;padding:40px 24px 30px">
  <div class="row" style="gap:6px"><div style="height:6px;border-radius:3px;width:28px;background:var(--kesri)"></div><div style="height:6px;border-radius:3px;width:12px;background:var(--rule)"></div></div>
  <div class="col" style="gap:8px;margin-top:40px">
    <div class="row" style="gap:10px"><svg width="36" height="36" viewBox="0 0 40 40" style="display:block;flex:none"><path d="M4 27A16 16 0 0 1 36 27" fill="none" stroke="var(--primary)" stroke-width="2.16" stroke-linecap="round"/><path d="M6 31.5H34" fill="none" stroke="var(--primary)" stroke-width="2.16" stroke-linecap="round"/><path d="M12 27A8 8 0 0 1 28 27Z" fill="var(--kesri)"/></svg>
      <div class="disp" style="font-size:22px;font-weight:700">Hazri</div></div>
    <div class="disp" style="font-size:28px;font-weight:700;line-height:1.2;margin-top:18px">
      Choose your language</div>
    <div style="font-size:14.5px;color:var(--muted)">You can change it any time in Settings.</div>
  </div>
  <div class="col" style="gap:10px;margin-top:24px">
    <div class="row" style="gap:14px;padding:16px 18px;border-radius:18px;min-height:72px;background:var(--card);box-shadow:var(--shadow)"><div class="col" style="flex:1"><div class="gur" style="font-size:22px;font-weight:700;line-height:1.3">ਪੰਜਾਬੀ</div><div style="font-size:13px;color:var(--muted)">Punjabi</div></div><div style="width:24px;height:24px;border-radius:12px;border:2px solid var(--rule)"></div></div>
    <div class="row" style="gap:14px;padding:16px 18px;border-radius:18px;min-height:72px;background:var(--card);box-shadow:var(--shadow)"><div class="col" style="flex:1"><div class="dev" style="font-size:22px;font-weight:700;line-height:1.3">हिन्दी</div><div style="font-size:13px;color:var(--muted)">Hindi</div></div><div style="width:24px;height:24px;border-radius:12px;border:2px solid var(--rule)"></div></div>
    <div class="row" style="gap:14px;padding:16px 18px;border-radius:18px;min-height:72px;background:var(--card);box-shadow:inset 0 0 0 2px var(--kesri)"><div class="col" style="flex:1"><div class="" style="font-size:22px;font-weight:700;line-height:1.3">English</div><div style="font-size:13px;color:var(--muted)">English</div></div><div style="width:24px;height:24px;border-radius:12px;background:var(--kesri);display:flex;align-items:center;justify-content:center;color:#fff"><svg class="i" width="16" height="16" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div></div>
  </div>
  <div style="flex:1"></div>
  <div style="margin-bottom:14px"><div class="row" style="justify-content:center;gap:12px;font-size:12px;color:var(--muted);font-weight:600"><div>Works offline</div><div>·</div><div>No login</div><div>·</div><div>No ads on Gurbani</div></div></div>
  <div class="btn" style="background:var(--primary);color:var(--onPrimary)">Continue</div>
</div>
</div>
</body></html>
