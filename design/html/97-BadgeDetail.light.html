<!doctype html>
<html><head><meta charset="utf-8"><title>Badges — one, opened — light</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Paaji+2:wght@500;600;700&amp;family=Mukta:wght@400;500;600;700&amp;family=Noto+Serif+Gurmukhi:wght@400;500;600;700&amp;family=Noto+Serif+Devanagari:wght@400;500;600&amp;display=swap">
  <style>
body{margin:0;background:#888}
.app{--bg:#F4F3F8;--card:#FFFFFF;--card2:#ECEBF3;--ink:#1B1D3A;--ink2:#4D5070;--muted:#85879F;--rule:#E1E1EA;--primary:#262C63;--onPrimary:#FFFFFF;--kesri:#D9730D;--kesriSoft:#FBE8D2;--kesriInk:#9A4F00;--sage:#2E7A57;--sageSoft:#DCEFE5;--teal:#1F7A8C;--hl:#FBE5CB;--word:#A04F00;--simranField:#080B1C;--simranThread:#E8F4F8;--scrim:rgba(20,22,45,.45);--shadow:0 1px 2px rgba(27,29,58,.06),0 10px 28px rgba(27,29,58,.07);
  width:390px;height:844px;background:var(--bg);color:var(--ink);font-family:Mukta,'Noto Sans Devanagari',system-ui,sans-serif;position:relative;overflow:hidden;box-sizing:border-box;font-size:15px;line-height:1.45}
.app.dark{--bg:#0C0F24;--card:#161A37;--card2:#1F2447;--ink:#EDECF6;--ink2:#B9BAD3;--muted:#8084A6;--rule:#2A2F55;--primary:#F2A24E;--onPrimary:#1C1206;--kesri:#F2A24E;--kesriSoft:#3A2A1A;--kesriInk:#FFC27E;--sage:#6CCB9C;--sageSoft:#173327;--teal:#6FC3D3;--hl:rgba(242,162,78,.17);--word:#FFC27E;--simranField:#080B1C;--simranThread:#E8F4F8;--shadow:0 0 0 1px rgba(255,255,255,.04);}
.app *{box-sizing:border-box}
.gur{font-family:'Noto Serif Gurmukhi','Noto Sans Gurmukhi',serif}
.dev{font-family:'Noto Serif Devanagari','Noto Sans Devanagari',serif}
.disp{font-family:'Baloo Paaji 2',Mukta,system-ui,sans-serif}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
svg.i{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:16px;min-height:52px;font-weight:600;font-size:16px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.pad{padding:22px 20px 0}
</style></head><body>
<div class="app light">

<div class="col" style="height:100%">
  <div class="col" style="align-items:center;gap:4px;padding:20px 18px 28px;
    background:radial-gradient(90% 80% at 50% 100%,var(--kesriSoft),var(--bg))">
    <div class="row" style="align-self:stretch;justify-content:space-between">
      <div style="width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;
        background:var(--card);box-shadow:var(--shadow)"><svg class="i" width="20" height="20" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></div>
      <div style="font-size:13px;font-weight:700;color:var(--kesriInk)">Badge 4 of 10</div>
      <div style="width:40px"></div></div>
    <div style="margin-top:22px"><div style="width:128px;height:128px;flex:none;border-radius:64px;background:radial-gradient(circle at 35% 30%,#F7B76A,#D9730D 70%);box-shadow:0 0 0 7px var(--card),0 16px 34px rgba(217,115,13,.35);display:flex;align-items:center;justify-content:center"><svg width="61" height="61" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10.5 5.2 8 4.5 4 4.5v13c4 0 6.5.7 8 2 1.5-1.3 4-2 8-2v-13c-4 0-6.5.7-8 2zM12 6.5v13"/></svg></div></div>
    <div class="gur" style="margin-top:18px;font-size:30px;font-weight:600;line-height:1.3">ਨਿਤਨੇਮੀ</div>
    <div class="disp" style="font-size:21px;font-weight:700;line-height:1">Nitnemi</div>
    <div class="chip" style="margin-top:10px;background:var(--card);color:var(--kesriInk)">Earned 8 Oct 2026</div>
  </div>
  <div class="col" style="gap:12px;padding:4px 18px 0">
    <div class="col" style="padding:16px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);gap:4px"><div class="eyebrow">What it marks</div>
      <div style="font-size:15.5px;line-height:1.45">Keeps the Nitnem.</div></div>
    <div class="col" style="padding:16px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);gap:4px"><div class="eyebrow">How it is earned</div>
      <div style="font-size:15.5px;line-height:1.45">Japji Sahib, Jaap Sahib, Tav Prasad Savaiye, Chaupai Sahib
        and Anand Sahib, all five on the same day, on 40 days. The days need not be in a row.</div></div>
  </div>
  <div style="flex:1"></div>
  <div class="row" style="justify-content:space-between;padding:0 18px 30px">
    <a style="display:flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:14px;background:var(--card);color:var(--ink2);font-size:14px;font-weight:600"><svg class="i" width="16" height="16" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Abhyasi</a>
    <a style="display:flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:14px;background:var(--card);color:var(--ink2);font-size:14px;font-weight:600">Simrani<div style="transform:rotate(180deg)"><svg class="i" width="16" height="16" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></div></a>
  </div>
</div>
</div>
</body></html>
