name: hazri
description: "Hazri — your daily Nitnem, always with you."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Material's platform-adaptive widgets reference CupertinoIcons, and the icon
  # tree-shaker warns when the font is absent.
  cupertino_icons: ^1.0.8

  # State & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Data
  drift: ^2.23.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.4

  # Audio: playback, the media session that keeps paath going in the
  # background, and audio-focus handling for calls and unplugged headphones.
  just_audio: ^0.9.42
  audio_service: ^0.18.15
  audio_session: ^0.1.21

  # Presentation
  intl: ^0.20.2
  flutter_svg: ^2.0.16
  scrollable_positioned_list: ^0.3.8
  wakelock_plus: ^1.2.10
  share_plus: ^10.1.3

  # Reminders
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^4.1.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_analytics: ^12.6.0

  # Sync needs to know whether the phone is on Wi-Fi, because "only on Wi-Fi"
  # is a promise about somebody's mobile data and not a preference we can
  # guess at (design 49).
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  drift_dev: ^2.23.1
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/content/
    - assets/audio/
    - assets/geo/
  fonts:
    - family: Mukta
      fonts:
        - asset: assets/fonts/Mukta-Regular.ttf
          weight: 400
        - asset: assets/fonts/Mukta-Medium.ttf
          weight: 500
        - asset: assets/fonts/Mukta-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Mukta-Bold.ttf
          weight: 700
    - family: BalooPaaji2
      fonts:
        - asset: assets/fonts/BalooPaaji2-Medium.ttf
          weight: 500
        - asset: assets/fonts/BalooPaaji2-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BalooPaaji2-Bold.ttf
          weight: 700
    - family: NotoSerifGurmukhi
      fonts:
        - asset: assets/fonts/NotoSerifGurmukhi-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSerifGurmukhi-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSerifGurmukhi-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSerifGurmukhi-Bold.ttf
          weight: 700
    - family: NotoSerifDevanagari
      fonts:
        - asset: assets/fonts/NotoSerifDevanagari-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSerifDevanagari-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSerifDevanagari-SemiBold.ttf
          weight: 600
