# Sized for the machine that actually runs this build.
#
# These were -Xmx8G with a 4G metaspace. A GitHub-hosted ubuntu runner has
# 7 GB of RAM in total, and Gradle is not alone on it: there is a Kotlin
# compile daemon beside it and the Dart AOT compiler after it. Asking for 12 GB
# of JVM on a 7 GB machine does not fail politely -- the kernel's OOM killer
# takes the process tree, the runner dies with SIGTERM, and GitHub reports
# "The operation was canceled" with exit 143 and no other explanation. It
# survived for as long as the build stayed small enough not to reach the
# ceiling, which is why it passed for weeks and then started dying at twelve
# minutes.
#
# 4 GB of heap builds this project with room to spare. Raise it if a real
# OutOfMemoryError ever appears in a log; do not raise it past what the
# machine has.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m

# A heap dump on OOM is 4 GB written to a disk that is also nearly full by
# then, which turns a legible memory error into a confusing disk one.

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
